
<div class="card">

    <h2>🛒 SHOPPING CART</h2>

    <hr>

    <div class="cart-info">

        <p>Product: <strong>{{productName || 'No product'}}</strong></p>

        <p>Unit Price: <strong>{{productPrice}} JOD</strong></p>

        <p>Quantity: <strong>{{productQuantity}}</strong></p>

    </div>

    <hr>

    <div class="total">
        <span>Total Price:</span>
        <strong>{{total}} JOD</strong>
    </div>

</div>
