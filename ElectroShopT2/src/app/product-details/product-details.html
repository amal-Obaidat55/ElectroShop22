<div class="details">

    <h2>Product Details</h2>

    <img [src]="productImage" width="200">

    <h3>{{productName}}</h3>

    <p>{{productDescription}}</p>

    <p>Price: {{productPrice}} JOD</p>

    <p>Quantity: {{quantity}}</p>

    <p>Discount: {{discountPercentage}}%</p>

    <p>Available: {{isAvailable}}</p>

</div>
